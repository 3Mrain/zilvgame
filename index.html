<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily · 打卡</title>
<style>
  :root {
    --bg: #0b0d12; --bg-soft: #12151c;
    --bg-card: rgba(255,255,255,0.03);
    --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.14);
    --text: #f0f2f5; --text-dim: #8a90a0; --text-mute: #555a68;
    --accent: #e8e6e1; --accent-2: #c8b896;
    --ok: #6dbf8a; --warn: #d4a54c; --err: #e85d75;
    --shadow: 0 1px 0 rgba(255,255,255,0.04), 0 20px 60px -20px rgba(0,0,0,0.6);
  }
  [data-theme="light"] {
    --bg: #ece1c6; --bg-soft: #f5edd8;
    --bg-card: rgba(120, 90, 40, 0.045);
    --border: rgba(120, 90, 40, 0.15); --border-strong: rgba(120, 90, 40, 0.26);
    --text: #2b2417; --text-dim: #6d6046; --text-mute: #a2936f;
    --accent: #2b2417; --accent-2: #8b7a54;
    --ok: #3d8a5a; --warn: #9b6a1e; --err: #b23b52;
    --shadow: 0 1px 0 rgba(0,0,0,0.02), 0 20px 50px -20px rgba(120, 90, 40, 0.25);
  }
  * { box-sizing: border-box; } html,body { margin:0; padding:0; }
  body {
    font-family: "Inter","PingFang SC","Microsoft YaHei",-apple-system,Segoe UI,system-ui,sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    -webkit-font-smoothing: antialiased; letter-spacing: 0.005em; overflow-x: hidden;
    transition: background .5s ease, color .3s ease;
  }
  body::before {
    content:""; position:fixed; inset:0;
    background: radial-gradient(1200px 600px at 10% -10%, rgba(200,184,150,0.08), transparent 60%),
                radial-gradient(900px 500px at 110% 110%, rgba(100,120,200,0.06), transparent 60%);
    pointer-events:none; z-index:0;
  }
  .wrap { position:relative; z-index:1; max-width:820px; margin:0 auto; padding:40px 24px 160px; }

  /* Header */
  header.top { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; }
  .brand { font-weight:600; font-size:15px; letter-spacing:0.14em; color:var(--text-dim); text-transform:uppercase; }
  .brand .dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent-2); margin-right:10px; vertical-align:middle; }
  .header-right { display:flex; align-items:center; gap:10px; }
  .icon-btn { background:transparent; border:1px solid var(--border); color:var(--text-dim); width:36px; height:36px; border-radius:10px; cursor:pointer; display:grid; place-items:center; transition:all .2s ease; }
  .icon-btn:hover { border-color:var(--border-strong); color:var(--text); }
  .icon-btn svg { width:16px; height:16px; }

  .date-block { margin-bottom:32px; }
  .date-block .weekday { font-size:12px; letter-spacing:0.22em; text-transform:uppercase; color:var(--text-mute); margin-bottom:6px; }
  .date-block .date { font-size:36px; font-weight:300; letter-spacing:-0.02em; }
  .date-block .date em { font-style:normal; color:var(--accent-2); font-weight:500; }

  /* 考试倒计时横幅 */
  .exam-countdown {
    margin-top: 18px; display: inline-flex; align-items: baseline; gap: 8px;
    padding: 12px 20px; border-radius: 14px;
    background: var(--bg-card); border: 1px solid var(--border-strong);
    box-shadow: var(--shadow);
  }
  .exam-label { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-mute); }
  .exam-days { font-size: 34px; font-weight: 300; letter-spacing: -0.02em; color: var(--accent-2); font-variant-numeric: tabular-nums; line-height: 1; }
  .exam-unit { font-size: 13px; color: var(--text-dim); }
  .exam-date { font-size: 11px; color: var(--text-mute); margin-left: 6px; letter-spacing: 0.04em; }

  .section-head { display:flex; align-items:center; justify-content:space-between; margin:32px 4px 14px; }
  .section-head h3 { margin:0; font-size:11px; letter-spacing:0.22em; text-transform:uppercase; color:var(--text-mute); font-weight:600; }

  /* Buttons */
  .btn { border:1px solid var(--border-strong); background:var(--bg-soft); color:var(--text); padding:12px 22px; border-radius:12px; font-size:13px; font-weight:500; letter-spacing:0.04em; cursor:pointer; transition:all .2s ease; font-family:inherit; }
  .btn:hover { border-color:var(--accent-2); color:var(--accent-2); }
  .btn:active { transform:scale(0.98); }
  .btn-primary { background:var(--text); color:var(--bg); border-color:var(--text); }
  .btn-primary:hover { background:var(--accent-2); border-color:var(--accent-2); color:var(--bg); }
  .btn-ghost { background:transparent; }
  .btn-danger:hover { border-color:var(--err); color:var(--err); }
  .btn-sm { padding:8px 14px; font-size:12px; border-radius:10px; }
  .btn:disabled { opacity:0.45; cursor:not-allowed; }

  /* Project cards */
  .proj-list { display:grid; gap:14px; }
  .proj-list.empty { display:none; }
  .empty-hint { text-align:center; padding:56px 20px; color:var(--text-mute); font-size:14px; border:1px dashed var(--border); border-radius:16px; }
  .empty-hint strong { display:block; color:var(--text-dim); font-size:15px; margin-bottom:6px; font-weight:500; }

  .proj {
    background:var(--bg-card); border:1px solid var(--border); border-radius:18px;
    padding:20px 22px; display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center;
    transition:border-color .2s ease;
  }
  .proj.running { border-color:var(--accent-2); }
  .proj.today-done { border-color:rgba(109,191,138,0.35); }
  .proj.today-miss { border-color:rgba(232,93,117,0.35); }

  .proj-icon { width:44px; height:44px; border-radius:12px; background:var(--bg-soft); border:1px solid var(--border); display:grid; place-items:center; font-size:20px; }
  .proj-body { min-width:0; }
  .proj-name { font-size:15px; font-weight:500; display:flex; align-items:center; gap:8px; }
  .proj-meta { font-size:12px; color:var(--text-dim); margin-top:4px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .proj-timer-big { font-size:22px; font-weight:200; letter-spacing:-0.01em; font-variant-numeric:tabular-nums; color:var(--accent-2); margin-top:6px; }

  .badge { display:inline-flex; align-items:center; gap:4px; padding:2px 10px; border-radius:999px; font-size:11px; letter-spacing:0.04em; border:1px solid var(--border); color:var(--text-dim); }
  .badge.timer { border-color:rgba(200,184,150,0.35); color:var(--accent-2); }
  .badge.flex { border-color:rgba(123,138,181,0.35); color:#7b8ab5; }
  .badge.done { border-color:rgba(109,191,138,0.45); color:var(--ok); }
  .badge.miss { border-color:rgba(232,93,117,0.45); color:var(--err); }
  .badge.rest { border-color:rgba(85,90,104,0.4); color:var(--text-mute); }

  .proj-actions { display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  .proj-actions .btn { min-width:120px; }
  .proj-sub { display:flex; gap:4px; }
  .proj-sub .icon-btn { width:32px; height:32px; border-radius:8px; }

  /* History */
  .hist-block { margin-bottom:28px; }
  .hist-block h4 { margin:0 0 12px; font-size:13px; color:var(--text-dim); font-weight:500; display:flex; align-items:center; gap:10px; }
  .hist-block h4::after { content:""; flex:1; height:1px; background:var(--border); }
  .hist-table { width:100%; border-collapse:separate; border-spacing:0 4px; font-size:13px; }
  .hist-table thead th { font-size:11px; text-transform:uppercase; letter-spacing:0.14em; color:var(--text-mute); font-weight:600; text-align:left; padding:6px 12px; border-bottom:1px solid var(--border); }
  .hist-table tbody tr { background:var(--bg-card); }
  .hist-table tbody tr td { padding:10px 12px; border-top:1px solid var(--border); }
  .hist-table tbody tr td:first-child { border-radius:10px 0 0 10px; }
  .hist-table tbody tr td:last-child { border-radius:0 10px 10px 0; }

  .cell-status { width:70px; text-align:center; }
  .cell-date { width:110px; color:var(--text); font-weight:500; }
  .cell-sched { width:140px; color:var(--text-dim); font-variant-numeric:tabular-nums; }
  .cell-actual { width:140px; color:var(--text-dim); font-variant-numeric:tabular-nums; }
  .cell-dur { width:80px; text-align:right; color:var(--text); font-variant-numeric:tabular-nums; }

  .status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  .status-ok { color:var(--ok); }
  .status-ok .status-dot { background:var(--ok); }
  .status-over { color:var(--ok); }
  .status-over .status-dot { background:var(--ok); box-shadow:0 0 0 3px rgba(109,191,138,0.25); }
  .status-warn { color:var(--warn); }
  .status-warn .status-dot { background:var(--warn); }
  .status-err { color:var(--err); }
  .status-err .status-dot { background:var(--err); }

  /* Modal */
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(8px); display:grid; place-items:center; z-index:900; opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .modal-bg.show { opacity:1; pointer-events:auto; }
  .modal { width:100%; max-width:480px; max-height:92vh; overflow-y:auto; background:var(--bg-soft); border:1px solid var(--border-strong); border-radius:20px; padding:28px; box-shadow:var(--shadow); transform:translateY(10px) scale(0.98); transition:transform .25s ease; }
  .modal-bg.show .modal { transform:none; }
  .modal h3 { margin:0 0 22px; font-size:18px; font-weight:500; letter-spacing:-0.01em; }
  .modal label { display:block; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--text-mute); margin-bottom:8px; margin-top:18px; }
  .modal label:first-of-type { margin-top:0; }
  .modal input[type="text"], .modal input[type="number"], .modal input[type="time"] {
    width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:12px 14px;
    border-radius:10px; font-size:14px; font-family:inherit; outline:none; transition:border-color .2s ease;
  }
  .modal input:focus { border-color:var(--accent-2); }
  .modal .time-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  .radio-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px; }
  .radio-card { border:1px solid var(--border); border-radius:12px; padding:12px 14px; cursor:pointer; transition:all .2s ease; background:var(--bg); }
  .radio-card:hover { border-color:var(--border-strong); }
  .radio-card.active { border-color:var(--accent-2); background:rgba(200,184,150,0.06); }
  .radio-card .r-title { font-size:13px; font-weight:500; }
  .radio-card .r-desc { font-size:11px; color:var(--text-dim); margin-top:2px; }

  .weekday-row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .weekday-chip { width:40px; height:40px; border-radius:10px; border:1px solid var(--border); background:var(--bg); display:grid; place-items:center; cursor:pointer; font-size:13px; color:var(--text-dim); transition:all .15s ease; }
  .weekday-chip:hover { border-color:var(--border-strong); }
  .weekday-chip.on { border-color:var(--accent-2); background:rgba(200,184,150,0.1); color:var(--text); }

  .icon-picker { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .icon-chip { width:38px; height:38px; border-radius:10px; display:grid; place-items:center; border:1px solid var(--border); background:var(--bg); cursor:pointer; font-size:18px; transition:all .15s ease; }
  .icon-chip:hover { border-color:var(--border-strong); }
  .icon-chip.active { border-color:var(--accent-2); background:rgba(200,184,150,0.1); }

  .modal .actions { display:flex; gap:10px; margin-top:28px; justify-content:flex-end; }
  .modal .actions .btn-danger { margin-right:auto; }

  .hint { font-size:12px; color:var(--text-mute); margin-top:4px; }

  /* Danmaku 弹幕层 */
  #danmakuLayer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 2; }
  .danmaku-item {
    position: absolute; left: 0; top: 0;
    white-space: nowrap; line-height: 1.6;
    color: var(--text-dim); opacity: 0.28;
    pointer-events: auto; cursor: default;
    will-change: transform;
    animation-name: danmaku-move;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    transition: opacity .25s ease, color .25s ease;
    user-select: none;
  }
  .danmaku-item:hover {
    animation-play-state: paused;
    opacity: 1; color: var(--accent-2);
    text-shadow: 0 0 12px rgba(200,184,150,0.35);
  }
  @keyframes danmaku-move {
    from { transform: translateX(100vw); }
    to   { transform: translateX(-100%); }
  }

  /* FX / Celebrate */
  #fx { position:fixed; inset:0; pointer-events:none; z-index:995; }
  .celebrate { position:fixed; inset:0; z-index:996; display:grid; place-items:center; pointer-events:none; }
  .celebrate-card { text-align:center; opacity:0; transform:translateY(20px) scale(0.96); transition:opacity .6s ease, transform .8s cubic-bezier(.2,.8,.2,1); }
  .celebrate.show .celebrate-card { opacity:1; transform:none; }
  .celebrate-title { font-size:56px; font-weight:200; letter-spacing:-0.02em; color:var(--accent-2); margin:0; }
  .celebrate-sub { font-size:14px; letter-spacing:0.2em; text-transform:uppercase; color:var(--text-dim); margin-top:12px; }

  .toast { position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--bg-soft); border:1px solid var(--border-strong); color:var(--text); padding:12px 22px; border-radius:12px; font-size:14px; opacity:0; transition:all .3s ease; z-index:998; box-shadow:var(--shadow); }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  .live-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--err); margin-right:8px; vertical-align:middle; animation:softPulse 1.5s ease-in-out infinite; }
  @keyframes softPulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }

  /* Responsive */
  @media (max-width: 560px) {
    .wrap { padding:28px 16px 100px; }
    .date-block .date { font-size:28px; }
    .proj { grid-template-columns:auto 1fr; }
    .proj-actions { grid-column:1 / -1; flex-direction:row; justify-content:space-between; }
    .proj-actions .btn { flex:1; }
    .celebrate-title { font-size:40px; }
    .hist-table thead { display:none; }
    .hist-table tbody tr td { display:block; border-radius:0 !important; }
    .hist-table tbody tr { background:transparent; }
    .radio-grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body data-theme="light">
<div class="wrap">

  <header class="top">
    <div class="brand"><span class="dot"></span>Daily · 打卡</div>
    <div class="header-right">
      <button class="icon-btn" id="themeBtn" title="切换主题">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>
      </button>
    </div>
  </header>

  <section class="date-block">
    <div class="weekday" id="weekday">—</div>
    <div class="date" id="dateText">—</div>
    <div class="exam-countdown" id="examCountdown">
      <span class="exam-label">专升本考试倒计时</span>
      <span class="exam-days" id="examDays">—</span>
      <span class="exam-unit">天</span>
      <span class="exam-date" id="examDate"></span>
    </div>
  </section>

  <div class="section-head">
    <h3>今日项目</h3>
    <button class="btn btn-sm btn-primary" id="addBtn">+ 添加项目</button>
  </div>

  <div class="proj-list" id="projList"></div>
  <div class="empty-hint" id="emptyHint" style="display:none">
    <strong>还没有打卡项目</strong>
    点右上角「+ 添加项目」来创建你的第一个项目
  </div>

  <div class="section-head">
    <h3>历史记录（近 14 天）</h3>
  </div>
  <div id="historyArea"><div class="empty-hint">暂无记录</div></div>

</div>

<!-- Modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">添加项目</h3>

    <label>项目名称</label>
    <input type="text" id="fName" placeholder="如：英语学习、健身" maxlength="20" />

    <label>图标</label>
    <div class="icon-picker" id="iconPicker"></div>

    <label>打卡模式</label>
    <div class="radio-grid" id="modeRow">
      <div class="radio-card active" data-mode="timer">
        <div class="r-title">⏱ 计时模式</div>
        <div class="r-desc">设定目标时长，开始后自动倒计时到点完成</div>
      </div>
      <div class="radio-card" data-mode="flex">
        <div class="r-title">🎯 不限时打卡</div>
        <div class="r-desc">手动开始 / 结束，设置规范时段，记录实际时间</div>
      </div>
    </div>

    <label>频率</label>
    <div class="radio-grid" id="freqRow">
      <div class="radio-card active" data-freq="daily">
        <div class="r-title">每天</div><div class="r-desc">每天都打卡</div>
      </div>
      <div class="radio-card" data-freq="weekdays">
        <div class="r-title">工作日</div><div class="r-desc">周一至周五</div>
      </div>
      <div class="radio-card" data-freq="weekends">
        <div class="r-title">周末</div><div class="r-desc">周六、周日</div>
      </div>
      <div class="radio-card" data-freq="weekly">
        <div class="r-title">自定义</div><div class="r-desc">选择具体星期几</div>
      </div>
    </div>

    <div id="weeklyOpts" style="display:none">
      <label>选择星期</label>
      <div class="weekday-row" id="weekdayRow"></div>
    </div>

    <div id="timerOpts">
      <label>目标时长（分钟）</label>
      <input type="number" id="fTarget" min="1" max="1440" value="120" />
      <div class="hint">当天累计达到目标时长即算完成</div>
    </div>

    <div id="flexOpts" style="display:none">
      <label>规范打卡时段（仅做参考，记录实际时间）</label>
      <div class="time-row">
        <div>
          <input type="time" id="fStart" value="19:00" />
        </div>
        <div>
          <input type="time" id="fEnd" value="21:00" />
        </div>
      </div>
      <div class="hint">实际打卡时间与此时段有交集即算按时</div>
    </div>

    <div class="actions">
      <button class="btn btn-danger btn-ghost" id="delBtn" style="display:none">删除</button>
      <button class="btn btn-ghost" id="cancelBtn">取消</button>
      <button class="btn btn-primary" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<div id="danmakuLayer"></div>
<canvas id="fx"></canvas>
<div class="celebrate" id="celebrateEl">
  <div class="celebrate-card">
    <h1 class="celebrate-title" id="celebrateTitle">做得好！</h1>
    <div class="celebrate-sub" id="celebrateSub">继续保持 · 你很棒</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============== Storage ============== */
const STORAGE_KEY = 'daily_checkin_v3';
const load = () => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; } };
const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
let state = load();
state.settings = state.settings || { theme: 'light' };
state.projects = state.projects || [];
state.records = state.records || {}; // records[pid][YYYY-MM-DD]
state.active = state.active || null;  // { pid, startTs, mode, targetEndTs? }

/* ============== Utils ============== */
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2,'0');
const fmtYMD = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey = () => fmtYMD(new Date());
const WEEKDAYS_CN = ['日','一','二','三','四','五','六'];
const WEEKDAYS_FULL = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const fmtHMS = (sec) => { sec = Math.max(0, Math.floor(sec)); const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60; return `${pad(h)}:${pad(m)}:${pad(s)}`; };
const fmtShort = (sec) => { sec = Math.floor(sec); const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60); if(h>0) return `${h}h${m}m`; return `${m}m`; };
const fmtHHMM = (ts) => { const d=new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const hhmmToMin = (hhmm) => { const [h,m] = hhmm.split(':').map(Number); return h*60 + m; };
const getDayMinOf = (ts) => { const d=new Date(ts); return d.getHours()*60 + d.getMinutes(); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ============== Theme ============== */
document.body.dataset.theme = state.settings.theme;
$('themeBtn').onclick = () => {

/* ============== Schedule helpers ============== */
function shouldCheckinToday(proj, date = new Date()) {
  const day = date.getDay();
  const s = proj.schedule;
  if (!s) return true;
  switch (s.freq) {
    case 'daily': return true;
    case 'weekdays': return day >= 1 && day <= 5;
    case 'weekends': return day === 0 || day === 6;
    case 'weekly': return (s.weekdays || []).includes(day);
  }
  return true;
}
function scheduleLabel(proj) {
  const s = proj.schedule || {};
  switch (s.freq) {
    case 'daily': return '每天';
    case 'weekdays': return '工作日';
    case 'weekends': return '周末';
    case 'weekly':
      return (s.weekdays || []).sort().map(d => '周'+WEEKDAYS_CN[d]).join('·');
  }
  return '每天';
}
function weeklyDisplay(proj) { return scheduleLabel(proj); }

/* ============== Record helpers ============== */
function getRec(pid, dateKey = todayKey()) {
  return (state.records[pid] || {})[dateKey] || null;
}
function getOrCreateRec(pid, dateKey) {
  state.records[pid] = state.records[pid] || {};
  if (!state.records[pid][dateKey]) {
    state.records[pid][dateKey] = { shouldCheckin: false, status: 'miss', totalSec: 0, sessions: [] };
  }
  return state.records[pid][dateKey];
}
function streakOf(pid) {
  let s=0, d=new Date();
  while (true) {
    const k = fmtYMD(d);
    const r = (state.records[pid] || {})[k];
    if (r && (r.status === 'ontime' || r.status === 'overtime')) { s++; d.setDate(d.getDate()-1); }
    else break;
  }
  return s;
}

/* ============== Status calculation ============== */
// Computes status after a session ends
function computeStatus(proj, rec) {
  if (!rec.shouldCheckin) return null; // 休息日
  if (!rec.sessions || rec.sessions.length === 0) return 'miss';

  const totalSec = rec.totalSec || 0;
  const totalMin = totalSec / 60;

  if (proj.mode === 'timer') {
    const tgt = proj.targetMin || 120;
    if (totalMin >= tgt * 1.5) return 'overtime';
    if (totalMin >= tgt) return 'ontime';
    return 'miss';
  } else {
    // flex: check overlap with scheduled time across all sessions
    const st = hhmmToMin(proj.timeStart || '09:00');
    const et = hhmmToMin(proj.timeEnd || '18:00');
    let totalOverlapMin = 0;
    rec.sessions.forEach(s => {
      const asMin = getDayMinOf(s.startTs);
      const aeMin = getDayMinOf(s.endTs);
      const overlapStart = Math.max(st, asMin);
      const overlapEnd = Math.min(et, aeMin);
      totalOverlapMin += Math.max(0, overlapEnd - overlapStart);
    });
    // 有 10+ 分钟交集算合规
    if (totalOverlapMin < 10) {
      // 但如果有任何 session，算 outOfRange 而非 miss
      return 'outOfRange';
    }
    const scheduledDur = Math.max(10, et - st);
    if (totalMin >= scheduledDur * 1.2) return 'overtime';
    return 'ontime';
  }
}

/* ============== Active session helpers ============== */
function isActive(pid) { return state.active && state.active.pid === pid; }
function tick() {
  if (!state.active) return;
  // timer auto-end
  if (state.active.mode === 'timer' && state.active.targetEndTs && Date.now() >= state.active.targetEndTs) {
    endSession(state.active.pid, true);
  }
  renderProjects();
}
setInterval(tick, 500);

/* ============== Session actions ============== */
function startSession(pid) {
  const p = state.projects.find(x => x.id === pid);
  if (!p || state.active) return;
  state.active = { pid, startTs: Date.now(), mode: p.mode };
  if (p.mode === 'timer') {
    state.active.targetEndTs = state.active.startTs + (p.targetMin || 120) * 60 * 1000;
  }
  save(state);
  renderProjects();
  toast(p.mode === 'timer' ? '计时开始' : '打卡开始');
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
}

function endSession(pid, complete) {
  if (!state.active || state.active.pid !== pid) return;
  const p = state.projects.find(x => x.id === pid);
  const now = Date.now();
  const startTs = state.active.startTs;
  const elapsedSec = Math.max(1, Math.floor((now - startTs) / 1000));
  const k = fmtYMD(new Date(startTs));

  if (complete) {
    const rec = getOrCreateRec(pid, k);
    rec.shouldCheckin = shouldCheckinToday(p, new Date(startTs));
    rec.sessions = rec.sessions || [];
    rec.sessions.push({ startTs, endTs: now, sec: elapsedSec });
    rec.totalSec = (rec.totalSec || 0) + elapsedSec;
    rec.status = computeStatus(p, rec);
    save(state);
  }

  state.active = null;
  save(state);
  renderProjects();
  renderHistory();

  if (complete) {
    const rec = getRec(pid, k);
    celebrateFor(p, rec);
    soundCelebrate();
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification(p ? p.name : '打卡完成', { body: `今日累计 ${fmtShort(rec.totalSec)}` });
    }
  }
}

function stopSession(pid) {
  if (!state.active || state.active.pid !== pid) return;
  state.active = null; save(state);
  renderProjects();
  toast('已放弃本次打卡');
}

/* ============== Project rendering ============== */
$('projList').addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act, pid = t.dataset.pid;
  if (act === 'start') startSession(pid);
  else if (act === 'end') endSession(pid, true);
  else if (act === 'stop') stopSession(pid);
  else if (act === 'edit') openEditModal(pid);
});

function todayStatusFor(proj) {
  if (!shouldCheckinToday(proj)) return { label: '休息日', kind: 'rest' };
  const rec = getRec(proj.id);
  if (isActive(proj.id)) return { label: '进行中', kind: 'running' };
  if (!rec) return { label: '待打卡', kind: 'pending' };
  if (rec.status === 'ontime') return { label: '✓ 今日已完成', kind: 'ontime' };
  if (rec.status === 'overtime') return { label: '⭐ 超额完成', kind: 'overtime' };
  if (rec.status === 'outOfRange') return { label: '⚠ 区间外打卡', kind: 'outofrange' };
  if (rec.status === 'miss') return { label: '❌ 未打卡', kind: 'miss' };
  return { label: '待打卡', kind: 'pending' };
}

function renderProjects() {
  const list = $('projList'), empty = $('emptyHint');
  list.innerHTML = '';
  if (state.projects.length === 0) { empty.style.display='block'; list.style.display='none'; return; }
  empty.style.display='none'; list.style.display='';

  state.projects.forEach(p => {
    const active = isActive(p.id);
    const rec = getRec(p.id);
    const todaySt = todayStatusFor(p);
    const streak = streakOf(p.id);
    const totalToday = rec?.totalSec || 0;

    let cls = 'proj';
    if (active) cls += ' running';
    else if (todaySt.kind === 'ontime' || todaySt.kind === 'overtime') cls += ' today-done';
    else if (todaySt.kind === 'miss') cls += ' today-miss';

    // Main button
    let btnHTML = '';
    if (active) {
      if (p.mode === 'timer') btnHTML = `<button class="btn btn-ghost" data-act="stop" data-pid="${p.id}">放弃</button>`;
      else btnHTML = `<button class="btn btn-primary" data-act="end" data-pid="${p.id}">结束打卡</button>`;
    } else {
      btnHTML = `<button class="btn btn-primary" data-act="start" data-pid="${p.id}">${p.mode === 'timer' ? '开始' : '开始打卡'}</button>`;
    }

    // Big timer line
    let bigLine = '';
    if (active) {
      let show;
      if (p.mode === 'timer') {
        const remain = Math.max(0, (state.active.targetEndTs - Date.now()) / 1000);
        show = '倒计时 ' + fmtHMS(remain);
      } else {
        const elapsed = Math.floor((Date.now() - state.active.startTs)/1000);
        show = '已打卡 ' + fmtHMS(elapsed);
      }
      bigLine = `<div class="proj-timer-big"><span class="live-dot"></span>${show}</div>`;
    } else if (totalToday > 0) {
      bigLine = `<div class="proj-timer-big" style="color:var(--text-dim); font-size:14px; font-weight:400; letter-spacing:.02em;">今日累计 ${fmtShort(totalToday)}</div>`;
    }

    // Meta
    let modeBadge = p.mode === 'timer'
      ? `<span class="badge timer">⏱ 计时 ${p.targetMin}分钟</span>`
      : `<span class="badge flex">🎯 ${p.timeStart || '09:00'}-${p.timeEnd || '18:00'}</span>`;
    let freqBadge = `<span class="badge">${scheduleLabel(p)}</span>`;
    let stateBadge = '';
    if (todaySt.kind === 'ontime') stateBadge = `<span class="badge done">${todaySt.label}</span>`;
    else if (todaySt.kind === 'overtime') stateBadge = `<span class="badge done">${todaySt.label}</span>`;
    else if (todaySt.kind === 'miss') stateBadge = `<span class="badge miss">${todaySt.label}</span>`;
    else if (todaySt.kind === 'outofrange') stateBadge = `<span class="badge" style="border-color:rgba(212,165,76,0.45);color:var(--warn)">${todaySt.label}</span>`;
    else if (todaySt.kind === 'rest') stateBadge = `<span class="badge rest">${todaySt.label}</span>`;

    let streakHtml = streak >= 2 ? `<span style="color:var(--accent-2)">🔥 连续 ${streak}</span>` : '';

    const card = document.createElement('div');
    card.className = cls;
    card.innerHTML = `
      <div class="proj-icon">${p.icon || '✅'}</div>
      <div class="proj-body">
        <div class="proj-name">${p.name} ${stateBadge}</div>
        <div class="proj-meta">${modeBadge}${freqBadge}${streakHtml}</div>
        ${bigLine}
      </div>
      <div class="proj-actions">
        ${btnHTML}
        <div class="proj-sub">
          <button class="icon-btn" data-act="edit" data-pid="${p.id}" title="编辑">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
          </button>
        </div>
      </div>
    `;
    list.appendChild(card);
  });
}

/* ============== History ============== */
function renderHistory() {
  const area = $('historyArea');
  area.innerHTML = '';
  if (state.projects.length === 0) { area.innerHTML = '<div class="empty-hint">暂无项目</div>'; return; }

  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 13); // 14 days including today

  let hasAny = false;
  state.projects.forEach(p => {
    const rows = [];
    for (let i = 0; i <= 13; i++) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const k = fmtYMD(d);
      const should = shouldCheckinToday(p, d);
      if (!should) continue; // 休息日不展示
      const rec = (state.records[p.id] || {})[k];
      rows.push({ dateKey: k, date: d, rec, shouldCheckin: should });
    }
    if (rows.length === 0) return;
    hasAny = true;

    const block = document.createElement('div');
    block.className = 'hist-block';

    // Status summary for this project
    let summaryParts = [];
    rows.forEach(r => {
      if (!r.rec || r.rec.status === 'miss') summaryParts.push('miss');
      else summaryParts.push(r.rec.status);
    });
    const okCount = summaryParts.filter(s => s === 'ontime' || s === 'overtime').length;
    const missCount = summaryParts.filter(s => s === 'miss').length;
    block.innerHTML = `<h4>${p.icon || ''} ${p.name} <span style="color:var(--ok); font-size:12px;">✓${okCount}</span> · <span style="color:var(--err); font-size:12px;">✗${missCount}</span></h4>`;

    const tbl = document.createElement('table');
    tbl.className = 'hist-table';
    tbl.innerHTML = `
      <thead><tr>
        <th class="cell-date">日期</th>
        <th class="cell-sched">规范时段</th>
        <th class="cell-actual">实际时段</th>
        <th class="cell-dur">时长</th>
        <th class="cell-status">状态</th>
      </tr></thead>
      <tbody></tbody>
    `;
    const tbody = tbl.querySelector('tbody');

    rows.forEach(r => {
      const tr = document.createElement('tr');
      const dd = r.date;
      const dateLabel = `${dd.getMonth()+1}/${dd.getDate()} 周${WEEKDAYS_CN[dd.getDay()]}`;

      let schedCell = '';
      if (p.mode === 'timer') {
        schedCell = `≥ ${p.targetMin}min`;
      } else {
        schedCell = `${p.timeStart || '—'} - ${p.timeEnd || '—'}`;
      }

      let actualCell = '—';
      let durCell = '—';
      let statusMarkup = '';
      let rowColor = '';

      if (r.rec && r.rec.sessions && r.rec.sessions.length > 0) {
        // 汇总实际时段（从第一个session开始到最后一个session结束）
        const first = r.rec.sessions[0], last = r.rec.sessions[r.rec.sessions.length-1];
        actualCell = `${fmtHHMM(first.startTs)} - ${fmtHHMM(last.endTs)}`;
        durCell = fmtShort(r.rec.totalSec);
      }

      const st = r.rec?.status;
      if (st === 'ontime') {
        statusMarkup = '<span class="status-ok"><span class="status-dot"></span>按时</span>';
      } else if (st === 'overtime') {
        statusMarkup = '<span class="status-over"><span class="status-dot"></span>超额</span>';
      } else if (st === 'outOfRange') {
        statusMarkup = '<span class="status-warn"><span class="status-dot"></span>区间外</span>';
      } else {
        // miss (no record, or shouldCheckin && no sessions)
        statusMarkup = '<span class="status-err"><span class="status-dot"></span>未打卡</span>';
      }

      if (st === 'ontime' || st === 'overtime') rowColor = 'background:rgba(109,191,138,0.08);';
      else if (st === 'miss') rowColor = 'background:rgba(232,93,117,0.06);';
      else if (st === 'outOfRange') rowColor = 'background:rgba(212,165,76,0.06);';

      tr.style.cssText = rowColor;
      tr.innerHTML = `
        <td class="cell-date">${dateLabel}</td>
        <td class="cell-sched">${schedCell}</td>
        <td class="cell-actual">${actualCell}</td>
        <td class="cell-dur">${durCell}</td>
        <td class="cell-status">${statusMarkup}</td>
      `;
      tbody.appendChild(tr);
    });

    block.appendChild(tbl);
    area.appendChild(block);
  });

  if (!hasAny) area.innerHTML = '<div class="empty-hint">暂无记录</div>';
}

const WEEKDAY_LABELS = ['日','一','二','三','四','五','六'];

let editingId = null;
let formMode = 'timer';
let formFreq = 'daily';
let formWeekdays = [];
let endTouched = false;

  const box = $('weekdayRow'); box.innerHTML='';

$('modeRow').addEventListener('click', e => { const c = e.target.closest('.radio-card'); if(c) setModeUI(c.dataset.mode); });
$('freqRow').addEventListener('click', e => { const c = e.target.closest('.radio-card'); if(c) setFreqUI(c.dataset.freq); });

// Time auto-linkage: start change → default end = start+1h (unless end was manually touched)
$('fStart').addEventListener('change', () => {
  if (endTouched) return;
  const [h,m] = $('fStart').value.split(':').map(Number);
  let nh = h+1, nm = m;
  if (nh > 23) { nh = 23; nm = 59; }
  $('fEnd').value = `${pad(nh)}:${pad(nm)}`;
});
$('fEnd').addEventListener('change', () => { endTouched = true; });

$('addBtn').onclick = openAddModal;
$('cancelBtn').onclick = () => $('modalBg').classList.remove('show');
$('modalBg').addEventListener('click', e => { if (e.target === $('modalBg')) $('modalBg').classList.remove('show'); });

$('saveBtn').onclick = () => {
  const name = $('fName').value.trim();
  if (!name) { toast('请输入项目名称'); return; }
  const iconActive = document.querySelector('#iconPicker .icon-chip.active');
  const icon = iconActive ? iconActive.dataset.icon : '📚';

  const schedule = { freq: formFreq, weekdays: formFreq==='weekly' ? formWeekdays : [] };

  if (editingId) {
    const p = state.projects.find(x=>x.id===editingId);
    if (p) {
      p.name = name; p.icon = icon; p.mode = formMode; p.schedule = schedule;
      p.targetMin = formMode==='timer' ? Math.max(1, parseInt($('fTarget').value)||120) : 0;
      p.timeStart = formMode==='flex' ? $('fStart').value : '19:00';
      p.timeEnd = formMode==='flex' ? $('fEnd').value : '21:00';
    }
  } else {
    state.projects.push({
      id: uid(), name, icon, mode: formMode, schedule,
      targetMin: formMode==='timer' ? Math.max(1, parseInt($('fTarget').value)||120) : 0,
      timeStart: formMode==='flex' ? $('fStart').value : '19:00',
      timeEnd: formMode==='flex' ? $('fEnd').value : '21:00',
    });
  }
  save(state);
  $('modalBg').classList.remove('show');
  renderProjects();
  renderHistory();
};

$('delBtn').onclick = () => {
  if (!editingId) return;
  if (!confirm('删除项目及其历史记录？')) return;
  if (state.active && state.active.pid === editingId) state.active = null;
  state.projects = state.projects.filter(p => p.id !== editingId);
  delete state.records[editingId];
  save(state);
  $('modalBg').classList.remove('show');
  renderProjects(); renderHistory();
};

/* ============== Celebrate ============== */
function celebrateFor(proj, rec) {
  const el = $('celebrateEl');
  el.classList.add('show');

  let title = '做得好！';
  let sub = `${proj.name} · 今日累计 ${fmtShort(rec?.totalSec||0)}`;

  if (rec?.status === 'overtime') { title = '超越目标！'; sub = `${proj.name} · 超额 ${fmtShort(rec.totalSec)}`; }
  else if (rec?.status === 'outOfRange') { title = '有记录'; sub = `${proj.name} · ${fmtShort(rec.totalSec)}（时段外）`; }

  $('celebrateSub').textContent = sub;

  let r=0; const iv=setInterval(()=>{rain(); r++; if(r>8) clearInterval(iv);},180);
  setTimeout(()=>el.classList.remove('show'), 5000);
}

/* ============== FX particles ============== */
const fx = $('fx').getContext('2d');
let W=0, H=0, particles=[];
function resizeFx() {
  W = fx.width = innerWidth*devicePixelRatio; H = fx.height = innerHeight*devicePixelRatio;
  $('fx').style.width = innerWidth+'px'; $('fx').style.height = innerHeight+'px';
}
resizeFx(); addEventListener('resize', resizeFx);
class Particle {
  constructor(x,y,color){
    this.x=x; this.y=y; const a=Math.random()*Math.PI*2; const v=(Math.random()*4+2)*devicePixelRatio;
    this.vx=Math.cos(a)*v; this.vy=Math.sin(a)*v-2*devicePixelRatio;
    this.g=0.08*devicePixelRatio; this.life=1; this.decay=0.006+Math.random()*0.01;
    this.r=(Math.random()*3+1.5)*devicePixelRatio; this.color=color;
  }
  update(){ this.vy+=this.g; this.x+=this.vx; this.y+=this.vy; this.vx*=0.99; this.life-=this.decay; }
  draw(){ fx.globalAlpha=Math.max(0,this.life); fx.fillStyle=this.color; fx.beginPath(); fx.arc(this.x,this.y,this.r,0,Math.PI*2); fx.fill(); }
}
function explode(){
  const cx=W/2,cy=H/2; const colors=['#c8b896','#e8e6e1','#8b7a54','#d4a574','#f4e8d0','#7b8ab5','#6dbf8a'];
  for(let i=0;i<220;i++) particles.push(new Particle(cx,cy,colors[Math.floor(Math.random()*colors.length)]));
}
function rain(){
  const colors=['#c8b896','#e8e6e1','#8b7a54','#d4a574','#6dbf8a'];
  for(let i=0;i<60;i++){
    const p=new Particle(Math.random()*W,-20,colors[Math.floor(Math.random()*colors.length)]);
    p.vx=(Math.random()-0.5)*2; p.vy=Math.random()*3+1; p.g=0; p.decay=0.0015; particles.push(p);
  }
}
function animateFx(){
  fx.clearRect(0,0,W,H);
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.update(); p.draw(); if(p.life<=0||p.y>H+50) particles.splice(i,1); }
  requestAnimationFrame(animateFx);
}
animateFx();

/* ============== Sound ============== */
let audioCtx=null;
function ensureAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }
function playTone(freq,start,dur,type='sine',vol=0.15){
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0,start); g.gain.linearRampToValueAtTime(vol,start+0.02); g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
  o.connect(g).connect(audioCtx.destination); o.start(start); o.stop(start+dur+0.05);
}
function soundCelebrate(){
  ensureAudio(); const now=audioCtx.currentTime;
  [523.25,659.25,783.99,1046.50].forEach((f,i)=>playTone(f,now+i*0.12,0.35,'triangle',0.18));
  playTone(1318.51,now+0.55,0.5,'sine',0.1); playTone(1567.98,now+0.75,0.6,'sine',0.08);
}

function initDanmaku() {
  const layer = $('danmakuLayer');
  layer.innerHTML = '';
  const TRACKS = 20;                 // 轨道数：同轨道弹幕同速错开，永不重叠
  const perTrack = Math.ceil(QUOTES.length / TRACKS);
  // 每条轨道独立随机速度（不同轨道速度不同 → 不规则感）
  const trackDur = Array.from({length: TRACKS}, () => 35 + Math.random() * 60); // 35~95s

  QUOTES.forEach((text, i) => {
    const track = i % TRACKS;
    const idxInTrack = Math.floor(i / TRACKS);
    const dur = trackDur[track];
    // 同轨道内延迟均分，负延迟让页面加载时弹幕已散布全屏
    const delay = -(dur * (idxInTrack / perTrack) + Math.random() * 1.5);

    const el = document.createElement('span');
    el.className = 'danmaku-item';
    el.textContent = text;
    el.style.top = (2.5 + track * (95 / TRACKS) + (Math.random() * 1.2 - 0.6)) + '%';
    el.style.fontSize = (12 + Math.random() * 4) + 'px';
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = delay + 's';
    layer.appendChild(el);
  });
}
initDanmaku();

}
